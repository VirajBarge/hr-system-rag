[project]
name = "hr-system-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viraj Barge", email = "virajnb21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-qdrant>=1.1.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[project.scripts]
hr-system-rag = "hr_system_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
